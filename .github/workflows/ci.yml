name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # OpenCV needs a GL library present even when only used headlessly.
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -e '.[dev]'

      - run: ruff check .
      - run: mypy facade_scan
      # The suite scores every numerical stage against the simulator, so it
      # needs no projector, no camera and no scan data to run here.
      - run: pytest -q
